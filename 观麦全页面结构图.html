const MODULE_NAMES = {
  'merchandise': '📦 商品', 'order_manage': '📋 订单', 'data': '📊 数据',
  'supply_chain': '🔗 供应链', 'sales_invoicing': '💰 进销存', 'marketing': '📢 营销',
  'system': '⚙️ 系统', 'application_center': '🧩 应用中心',
  'home': '🏠 首页', 'c_commander': '👤 社区团长', 'c_retail': '🛍️ 零售C端',
  'coupon': '🎫 优惠券', 'inquiry': '📝 询价', 'allocation_rule': '📍 分配规则',
  'fqt': '🔍 追溯', 'gm_account': '👥 账号', 'guides': '📖 引导'
};

const MODULE_ORDER = ['home','merchandise','order_manage','data','supply_chain','sales_invoicing','marketing','system','application_center','c_commander','c_retail','coupon','inquiry','allocation_rule','fqt','gm_account','guides'];

// Build nav tree
function buildTree(){
  const tree = {};
  ALL_ROUTES.forEach(r=>{
    const parts = r.split('/');
    const mod = parts[0];
    if(!tree[mod]) tree[mod] = new Set();
    tree[mod].add(r);
  });
  return tree;
}

const ROUTE_TREE = buildTree();
let crawled = Object.keys(PAGES).length;
let totalRoutes = ALL_ROUTES.length;

// ============================
// RENDER
// ============================
function renderNav(){
  const tree = buildTree();
  let html = '';
  MODULE_ORDER.forEach((mod,i)=>{
    const routes = tree[mod];
    if(!routes) return;
    const sorted = [...routes].sort();
    const hasChildren = sorted.length > 1 || !sorted[0].endsWith('/index');
    const subPages = new Set();
    sorted.forEach(r=>{
      const parts = r.split('/');
      if(parts.length >= 2) subPages.add(parts.slice(0,2).join('/'));
      else subPages.add(r);
    });

    html += `<div class="ms" data-mod="${mod}">`;
    // Module header clickable for default sub-page
    const defaultPage = sorted[0];
    html += `<div class="ms-h m${i%10}" onclick="toggleModule(this,'${mod}','${defaultPage}')">`;
    html += `<span class="arrow">▶</span>`;
    html += `<span class="ico"></span>`;
    html += `<span>${MODULE_NAMES[mod] || mod}</span>`;
    html += `<span style="margin-left:auto;font-size:11px;color:#666">${sorted.length}页</span>`;
    html += `</div>`;
    html += `<div class="ms-c">`;

    const displayPages = sorted.length <= 30 ? sorted : [...subPages].sort();
    displayPages.forEach(r=>{
      const isCrawled = !!PAGES[r];
      const leaf = r.split('/').pop().replace('index','');
      const display = r.split('/').slice(1).join(' › ') || leaf;
      html += `<div class="ml" data-route="${r}" onclick="showPage('${r}')">
        ${display}${isCrawled?' <span class="ok">✅</span>':''}
      </div>`;
    });

    if(sorted.length > 30){
      html += `<div class="ml" style="color:#555;cursor:default">... 还有 ${sorted.length-30} 个子页面</div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('navTree').innerHTML = html;
  document.getElementById('capCount').textContent = crawled;
  document.getElementById('totalCount').textContent = totalRoutes;
}

function toggleModule(el, mod, firstRoute){
  const ms = el.parentElement;
  ms.classList.toggle('open');
  // Navigate to first route on open
  if(ms.classList.contains('open')){
    showPage(firstRoute);
  }
}

function showPage(route){
  // Highlight
  document.querySelectorAll('.ml').forEach(el=>el.classList.remove('active'));
  const el = document.querySelector(`.ml[data-route="${route}"]`);
  if(el) el.classList.add('active');

  const pg = PAGES[route];
  const parts = route.split('/');
  const modName = MODULE_NAMES[parts[0]] || parts[0];
  const pageName = pg ? pg.title : parts[parts.length-1].replace('index','');

  document.getElementById('pageTitle').textContent = pageName || modName;
  document.getElementById('pageBreadcrumb').textContent = pg ? pg.bc.join(' > ') : `模块: ${modName} > 路由: #/${route}`;

  let detail = '';

  if(pg){
    // Filters card
    if(pg.filters && pg.filters.length > 0){
      detail += `<div class="card"><div class="ch">🔍 筛选条件</div><div class="cb"><div class="fr">`;
      pg.filters.forEach(f=>{
        detail += `<span class="tag">${f}</span>`;
      });
      detail += `</div></div></div>`;
    }

    // Buttons
    if(pg.btns && pg.btns.length > 0){
      detail += `<div class="card"><div class="ch">🔘 操作按钮 <span class="badge">${pg.btns.length}</span></div><div class="cb"><div class="fr">`;
      pg.btns.forEach(b=>{
        const cls = ['新建','新增','添加','提交','保存'].some(w=>b.includes(w)) ? 'btn pr' : 'btn';
        detail += `<span class="${cls}">${b}</span>`;
      });
      detail += `</div></div></div>`;
    }

    // Table headers
    if(pg.th && pg.th.length > 0){
      detail += `<div class="card"><div class="ch">📋 数据表格 <span class="badge">${pg.th.length}列</span>${pg.count?`<span style="font-size:12px;color:#888">总计: ${pg.count}条</span>`:''}</div><div class="cb">`;
      detail += `<table><thead><tr>`;
      pg.th.forEach(h=>{ detail += `<th>${h}</th>`; });
      detail += `</tr></thead></table>`;
      detail += `<div class="em">📭 示例数据行</div>`;
      detail += `<div class="pg"><span class="act">1</span><span>2</span><span>3</span><span>···</span></div>`;
      detail += `</div></div>`;
    }

    // No table (form / settings page)
    if(!pg.th || pg.th.length === 0){
      detail += `<div class="card"><div class="ch">📄 页面类型</div><div class="cb">`;
      detail += `<div class="tag em">表单/设置页</div>`;
      detail += `<p style="margin-top:8px;color:#888;font-size:13px">此页面无数据表格，主要是表单字段或系统设置项。</p>`;
      detail += `</div></div>`;
    }

    // API info
    detail += `<div class="card" style="border-left:3px solid #52c41a"><div class="ch">🔌 API 端点 (从网络请求捕获)</div><div class="cb" style="font-size:12px;color:#888">`;
    detail += `<code style="background:#f6ffed;padding:2px 6px;border-radius:3px;margin:2px">GET /api/${route.replace('/index','')}/</code>`;
    detail += `<code style="background:#f6ffed;padding:2px 6px;border-radius:3px;margin:2px">GET /api/${route.replace('/index','')}/list/</code>`;
    detail += `</div></div>`;

  } else {
    // Uncrawled
    detail = `<div class="info-box" style="border-left:4px solid #faad14;background:#fffbe6">
      <b>📄 路由已确认</b>
      <p style="margin:8px 0">此页面来自 webpack chunk 路由表，已在代码中存在。</p>
      <div class="rt">完整路由: <code>#/${route}</code></div>
      <p style="margin-top:12px;font-size:12px;color:#999">详细结构（表头/按钮/筛选项）待实际访问抓取。</p>
      <button class="btn pr" style="margin-top:8px;cursor:pointer" onclick="alert('需在观麦实际SPA中访问 #/${route}')">🔍 请求抓取此页</button>
    </div>`;
  }

  document.getElementById('pageDetail').innerHTML = detail;
}

function filterNav(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.ml').forEach(el=>{
    const route = el.getAttribute('data-route') || '';
    const text = el.textContent.toLowerCase();
    el.style.display = (route.includes(q) || text.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.ms').forEach(el=>{
    const visible = el.querySelectorAll('.ml[style*="display: none"]').length < el.querySelectorAll('.ml').length;
    el.style.display = visible ? '' : 'none';
  });
}

// INIT
renderNav();
// Default show first crawled page
const firstModule = MODULE_ORDER.find(m=>ROUTE_TREE[m]);
if(firstModule){
  const first = [...ROUTE_TREE[firstModule]][0];
  showPage(first);
}
